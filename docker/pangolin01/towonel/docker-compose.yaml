---
services:
  towonel-hub:
    # renovate: datasource=docker depName=registry.erwanleboucher.dev/eleboucher/towonel-node
    image: 'codeberg.org/towonel/towonel-node:1.8.0'
    hostname: 'towonel-hub'
    container_name: 'towonel-hub'
    restart: 'unless-stopped'
    user: '10001:10001'
    volumes:
      - '/opt/appdata/towonel:/data:rw'
    environment:
      - 'RUST_LOG=info'
      - 'TOWONEL_INVITE_HASH_KEY=${TOWONEL_INVITE_HASH_KEY}'
      - 'TOWONEL_HUB_ENABLED=true'
      - 'TOWONEL_HUB_ALLOW_PRIVILEGED_PORTS=true'
      - 'TOWONEL_HUB_PUBLIC_URL=https://towonel.${DOMAIN}'
      - 'TOWONEL_EDGE_ENABLED=true'
      - 'TOWONEL_EDGE_HEALTH_LISTEN_ADDR=0.0.0.0:9092'
      - 'TOWONEL_EDGE_IROH_PORT=51825'
      - 'TOWONEL_EDGE_LISTEN_ADDR=0.0.0.0:4443'
      - 'TOWONEL_EDGE_PROXY_PROTOCOL=true'
    ports:
      - '9987:9987/udp'
      - '10011:10011/tcp'
      - '30033:30033/tcp'
      - '21027:21027/udp'
      - '22000:22000/tcp'
      - '22000:22000/udp'
      - '51825:51825/udp'
    expose:
      - '4443'
      - '8443'
    healthcheck:
      test:
        - 'CMD'
        - 'curl'
        - '-fsS'
        - '-o'
        - '/dev/null'
        - 'http://127.0.0.1:8443/v1/health'
      interval: 30s
      timeout: 5s
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2.0'

networks:
  default:
    name: edge
    external: true
