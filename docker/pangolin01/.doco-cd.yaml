---
working_dir: ./docker/pangolin01
auto_discovery:
  enabled: true
  depth: 1
  delete: true
external_secrets:
  TZ: "op://Kubernetes/basic/TZ"
  CLOUDFLARE_EMAIL: "op://Kubernetes/cloudflare/CLOUDFLARE_EMAIL"
  CLOUDFLARE_TRAEFIK_API_TOKEN: "op://Kubernetes/cloudflare/CLOUDFLARE_TRAEFIK_API_TOKEN"
  DOMAIN: "op://Kubernetes/domains/DOMAIN"
  DOMAIN_PANGOLIN: "op://Kubernetes/domains/DOMAIN_PANGOLIN"
  DOMAIN_SHORT: "op://Kubernetes/domains/DOMAIN_SHORT"
  DOMAIN_PBFA: "op://Kubernetes/domains/DOMAIN_PBFA"
  MAXMIND_ACCOUNT_ID: op://Kubernetes/maxmind/MAXMIND_ACCOUNT_ID
  MAXMIND_PANGOLIN_LICENSE_KEY: op://Kubernetes/maxmind/MAXMIND_LICENSE_KEY
  PANGOLIN_SERVER_SECRET: op://Kubernetes/pangolin/PANGOLIN_SERVER_SECRET
  WG_PRESHARED_KEY: op://Kubernetes/wireguard/WG_PRESHARED_KEY
  WG_PANGOLIN01_PRIVATE_KEY: op://Kubernetes/wireguard/WG_PANGOLIN01_PRIVATE_KEY
  WG_UNIFI_EXT_PUBLIC_KEY: op://Kubernetes/wireguard/WG_UNIFI_EXT_PUBLIC_KEY
force_recreate: false
reconciliation:
  enabled: true
  interval: 3600
