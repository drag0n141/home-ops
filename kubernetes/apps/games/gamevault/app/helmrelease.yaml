---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gamevault
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      gamevault:
        labels:
          nfsMount: "true"
          postgres: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-credentials"
        containers:
          app:
            image:
              repository: ghcr.io/phalcode/gamevault-backend
              tag: 17.0.1@sha256:f3c599d4fc7498eb2028cfd611dc27b3f707c83a7ce9a86ec3ec8256a42409ba
            env:
              TZ: Europe/Berlin
              SERVER_REGISTRATION_DISABLED: false
              GAMES_INDEX_INTERVAL_IN_MINUTES: 240
              DB_SYSTEM: POSTGRESQL
              SERVER_PORT: &port 8080
              AUTH_BASIC_AUTH_ENABLED: false
              AUTH_OAUTH2_ENABLED: true
              AUTH_OAUTH2_AUTH_URL: https://id.${SECRET_DOMAIN}/authorize
              AUTH_OAUTH2_TOKEN_URL: https://id.${SECRET_DOMAIN}/api/oidc/token
              AUTH_OAUTH2_USERINFO_URL: https://id.${SECRET_DOMAIN}/api/oidc/userinfo
              AUTH_OAUTH2_CALLBACK_URL: https://gamevault.${SECRET_DOMAIN_INTERNAL}/api/auth/oauth2/login
            envFrom: *envFrom
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN_INTERNAL}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          gamevault:
            app:
              - path: /config
                subPath: config
              - path: /media
                subPath: media
      games:
        type: nfs
        server: nas01.${SECRET_DOMAIN_INT}
        path: /mnt/data/spiele
        globalMounts:
          - path: /files
      tmpfs:
        type: emptyDir
        advancedMounts:
          gamevault:
            app:
              - path: /logs
                subPath: logs
              - path: /tmp
                subPath: tmp
