---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: tracearr
spec:
  name: Tracearr
  callbackUrls:
    - "https://tracearr.${SECRET_DOMAIN_INTERNAL}/api/v1/auth/oauth2/callback/oidc"
  allowedUserGroups:
    - name: id-admin
      namespace: security
  secret:
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
