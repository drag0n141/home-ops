---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: RepositoryReplication
metadata:
  name: garage-idrive
spec:
  sourceRef:
    kind: ClusterRepository
    name: garage
  destination:
    s3:
      auth:
        secretRef:
          name: kopiur-idrive-secret
      bucket: kopiur
      endpoint: l6x1.fra.idrivee2-5.com
      region: eu-central-2
  schedule:
    cron: 0 5 * * *
  sync:
    deleteExtra: true
    parallel: 8
