---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .KOPIUR_AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .KOPIUR_AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: garage-nas
    - extract:
        key: kopiur
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-idrive
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-idrive-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .KOPIUR_AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .KOPIUR_AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: idrive
