---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-ui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      garage-ui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: mirror.gcr.io/noooste/garage-ui
              tag: v0.14.0@sha256:e4a33c448304a3f6e60f08d6aa71b2471fd79ac870a5c7e178ea247dea3238b3
            env:
              TZ: Europe/Berlin
              GARAGE_UI_GARAGE_ADMIN_ENDPOINT: http://garage.storage.svc.cluster.local:3903
              GARAGE_UI_GARAGE_ENDPOINT: http://garage.storage.svc.cluster.local:3900
              GARAGE_UI_SERVER_ROOT_URL: https://garage.${SECRET_DOMAIN_INTERNAL}
              GARAGE_UI_SERVER_PORT: &port 8080
              GARAGE_UI_AUTH_OIDC_ENABLED: true
              GARAGE_UI_AUTH_OIDC_PROVIDER_NAME: Pocket ID
              GARAGE_UI_AUTH_OIDC_ADMIN_ROLE: ID-Admin
              GARAGE_UI_AUTH_OIDC_ROLE_ATTRIBUTE_PATH: groups
              GARAGE_UI_AUTH_OIDC_SCOPES: "openid profile email groups"
              GARAGE_UI_AUTH_OIDC_ISSUER_URL: https://id.${SECRET_DOMAIN}
              GARAGE_UI_AUTH_OIDC_COOKIE_SECURE: true
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-credentials"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 50Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "garage.${SECRET_DOMAIN_INTERNAL}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
