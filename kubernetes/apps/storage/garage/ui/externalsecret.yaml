---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-ui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: garage-ui-secret
    creationPolicy: Owner
    template:
      data:
        GARAGE_UI_GARAGE_ADMIN_TOKEN: "{{ .GARAGE_ADMIN_TOKEN }}"
  dataFrom:
    - extract:
        key: garage
