---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hv-planer
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hv-planer-secret
    template:
      data:
        # App
        SESSION_SECRET: "{{ .HV_PLANER_SESSION_SECRET }}"
  dataFrom:
    - extract:
        key: hv-planer
