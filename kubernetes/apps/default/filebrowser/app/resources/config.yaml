auth:
  methods:
    password:
      enabled: false
    oidc:
      enabled: true
      clientId: "{{ .FILEBROWSER_CLIENT_ID }}"
      clientSecret: "{{ .FILEBROWSER_CLIENT_SECRET }}"
      issuerUrl: https://id.${SECRET_DOMAIN}
      scopes: "email openid profile groups"
      userIdentifier: preferred_username
      adminGroup: "ID-Admin"
      createUser: true
frontend:
  oidcLoginButtonText: "Sign in with Pocket ID"
  disableDefaultLinks: true
  disableUsedPercentage: true
  disableNavButtons: true
server:
  disableUpdateCheck: true
  database: /config/database.db
  externalUrl: https://filebrowser.${SECRET_DOMAIN}
  disableWebDAV: true
  cacheDir: /tmp/cache
  sources:
    - path: /media
      name: Home
      config:
        defaultEnabled: true
        defaultUserScope: "/"
        createUserDir: true
userDefaults:
  deleteAfterArchive: false
  singleClick: true
