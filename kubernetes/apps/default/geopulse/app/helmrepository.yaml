---
# GeoPulse only publishes a classic (non-OCI) chart repo, so this uses
# source.toolkit.fluxcd.io HelmRepository + HelmRelease.spec.chart
# instead of the OCIRepository + chartRef pattern used elsewhere.
#
# NOTE: https://tess1o.github.io/geopulse/charts currently 301-redirects
# to http://geopulse.cc/charts (see tess1o/geopulse#606, unresolved at
# time of writing). source-controller follows the redirect fine, but
# double-check this once upstream fixes the HTTPS redirect.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: geopulse
spec:
  interval: 1h
  url: https://tess1o.github.io/geopulse/charts
