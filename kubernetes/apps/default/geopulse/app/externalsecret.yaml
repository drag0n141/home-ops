---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: geopulse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: geopulse-secret
    template:
      data:
        # App (read by the backend via extraEnv, see helmrelease.yaml)
        GEOPULSE_POSTGRES_PASSWORD: &dbpass "{{ .GEOPULSE_POSTGRES_PASSWORD }}"
        # Postgres Init (read by the one-off db/role/extension init Job)
        INIT_POSTGRES_DBNAME: &dbname "{{ .GEOPULSE_POSTGRES_DB }}"
        INIT_POSTGRES_HOST: "postgres-rw.database.svc.cluster.local"
        INIT_POSTGRES_USER: &dbuser "{{ .GEOPULSE_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: geopulse
