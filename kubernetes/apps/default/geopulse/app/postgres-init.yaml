---
# GeoPulse's own Helm chart has no initContainers/extraInitContainers hook
# (unlike app-template or the netbox/nextcloud charts already in this repo),
# so the shared-postgres db/role/postgis bootstrap runs as a one-off Job
# instead of living inside a HelmRelease initContainer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: geopulse-initdb
data:
  geopulse.sql: |
    CREATE EXTENSION IF NOT EXISTS "postgis";
    CREATE EXTENSION IF NOT EXISTS postgis_topology;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: geopulse-postgres-init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18
          envFrom:
            - secretRef:
                name: geopulse-secret
          volumeMounts:
            - name: initdb
              mountPath: /initdb
      volumes:
        - name: initdb
          configMap:
            name: geopulse-initdb
