---
# postgres-init looks for /initdb/${INIT_POSTGRES_DBNAME}.sql - the key
# here MUST match externalPostgres.database in helmrelease.yaml exactly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: geopulse-initdb
data:
  geopulse_db.sql: |
    CREATE EXTENSION IF NOT EXISTS "postgis";
    CREATE EXTENSION IF NOT EXISTS postgis_topology;
