---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: geopulse
spec:
  interval: 1h
  # TODO: pin/verify against the published index — `helm search repo
  # geopulse/geopulse` — 1.39.0 matches the current appVersion at the
  # time this was written, chart version may differ slightly.
  chart:
    spec:
      chart: geopulse
      version: "1.39.0"
      sourceRef:
        kind: HelmRepository
        name: geopulse
  values:
    # Use the shared CloudNativePG cluster instead of the chart's bundled
    # postgres/postgis pod. Role, database and postgis extension are
    # provisioned by the init-db initContainer injected via postRenderers
    # below; the password is injected via backend.extraEnv (documented in
    # the chart's own values.yaml as the intended way to point
    # GEOPULSE_POSTGRES_PASSWORD at a secret the chart doesn't own).
    postgres:
      enabled: false
    externalPostgres:
      host: postgres-pgbouncer-rw.database.svc.cluster.local
      port: 5432
      database: geopulse
      username: geopulse
    backend:
      replicaCount: 1
      extraEnv:
        - name: GEOPULSE_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: geopulse-secret
              key: GEOPULSE_POSTGRES_PASSWORD
      resources:
        requests:
          cpu: 10m
          memory: 512Mi
        limits:
          memory: 2Gi
    frontend:
      replicaCount: 1
    config:
      publicBaseUrl: "https://geopulse.${SECRET_DOMAIN}"
      cookieDomain: ""
      authSecureCookies: true
      admin:
        firstUserAdmin: true
      jwt:
        issuer: "https://geopulse.${SECRET_DOMAIN}"
    # Gateway API route (this cluster uses Envoy Gateway, not ingress-nginx)
    route:
      enabled: true
      hostnames:
        - "geopulse.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-external
          namespace: networking
    ingress:
      enabled: false
  # GeoPulse's own chart has no initContainers/extraInitContainers hook
  # (unlike app-template or the netbox/nextcloud charts already in this
  # repo), so the shared-postgres db/role bootstrap is injected into the
  # rendered geopulse-backend Deployment here instead - same pattern as
  # forgejo/app/helmrelease.yaml. postgis itself is created from
  # initdb-configmap.yaml, mounted below.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: geopulse-backend
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: geopulse-backend
              spec:
                template:
                  spec:
                    initContainers:
                      - name: init-db
                        image: ghcr.io/home-operations/postgres-init:18
                        envFrom:
                          - secretRef:
                              name: geopulse-secret
                        volumeMounts:
                          - name: initdb
                            mountPath: /initdb
                    volumes:
                      - name: initdb
                        configMap:
                          name: geopulse-initdb
