---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flohmarkt
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      flohmarkt:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/drag0n141/flohmarkt
              tag: latest@sha256:434f50deef854d88ac95211ce5221d0d9d5df5aacda5ba5776c1c2de9b27a255
            env:
              TZ: Europe/Berlin
              NUM_TABLES: 40
              PRICE_STANDARD: 15.00
              PRICE_INTERNAL: 10.00
              CURRENCY: EUR
              PAYPAL_MODE: sandbox
              DB_PATH: /data/flohmarkt.db
              SMTP_HOST: smtp.strato.de
              SMTP_PORT: 587
              SMTP_USE_TLS: true
            envFrom:
              - secretRef:
                  name: flohmarkt-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 8000
    route:
      app:
        hostnames:
          - "flohmarkt.${SECRET_DOMAIN_SHORT}"
        parentRefs:
          - name: envoy-external
            namespace: networking
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          flohmarkt:
            app:
              - path: /data
                subPath: data
              - path: /app/static/uploads
                subPath: uploads
      tmpfs:
        type: emptyDir
        advancedMounts:
          flohmarkt:
            app:
              - path: /tmp
                subPath: tmp
