---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gotify
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      gotify:
        labels:
          postgres: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-credentials"
        containers:
          app:
            image:
              repository: ghcr.io/gotify/server
              tag: 3.1.0@sha256:be44495e4609c6f5b06c01a9445ec6198dba902ce49fc3d0d71ab585cda8014c
            env:
              TZ: Europe/Berlin
              GOTIFY_DATABASE_DIALECT: postgres
              GOTIFY_OIDC_ENABLED: true
              GOTIFY_OIDC_ISSUER: https://id.${SECRET_DOMAIN}
              GOTIFY_OIDC_REDIRECTURL: https://gotify.${SECRET_DOMAIN}/auth/oidc/callback
              GOTIFY_OIDC_AUTOREGISTER: true
              GOTIFY_OIDC_LINK_BY_USERNAME: true
              GOTIFY_LOCALAUTH_ENABLED: false
              GOTIFY_OIDC_IDP_NAME: Pocket ID
              GOTIFY_OIDC_GROUPS_ADMIN: ID-Admin
              GOTIFY_OIDC_SCOPES: openid,profile,email,groups
            envFrom: *envFrom
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: true
              capabilities: { add: ["CHMOD"], drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 50Mi
              limits:
                memory: 150Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 80
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
