---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gotify
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      gotify:
        labels:
          postgres: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom: &envFrom
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-credentials"
        containers:
          app:
            image:
              repository: ghcr.io/gotify/server
              tag: 3.1.1@sha256:44fc5bbd1c0618878e33073d38c2c13126b48f245c3fe12236b1da48eb203b86
            env:
              TZ: Europe/Berlin
              GOTIFY_DATABASE_DIALECT: postgres
              GOTIFY_OIDC_ENABLED: true
              GOTIFY_OIDC_ISSUER: https://id.${SECRET_DOMAIN}
              GOTIFY_OIDC_REDIRECTURL: https://gotify.${SECRET_DOMAIN}/auth/oidc/callback
              GOTIFY_OIDC_AUTOREGISTER: true
              GOTIFY_OIDC_LINK_BY_USERNAME: true
              GOTIFY_LOCALAUTH_ENABLED: true
              GOTIFY_OIDC_IDP_NAME: Pocket ID
              GOTIFY_OIDC_GROUPS_ADMIN: ID-Admin
              GOTIFY_OIDC_SCOPES: openid,profile,email,groups
            envFrom: *envFrom
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: true
              capabilities: { add: ["CHMOD"], drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 50Mi
              limits:
                memory: 150Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 80
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
