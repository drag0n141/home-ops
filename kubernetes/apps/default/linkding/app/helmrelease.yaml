---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkding
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      linkding:
        labels:
          postgres: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-credentials"
        containers:
          app:
            image:
              repository: ghcr.io/sissbruecker/linkding
              tag: 1.46.2@sha256:0c0a9a04c7ebd644293c37f98710872fe7cdff0ea1ff7fd9be4d235e4c4678d2
            env:
              TZ: Europe/Berlin
              LD_DISABLE_BACKGROUND_TASKS: false
              LD_DISABLE_URL_VALIDATION: false
              LD_DISABLE_LOGIN_FORM: true
              LD_DB_ENGINE: postgres
              LD_ENABLE_OIDC: true
              OIDC_OP_AUTHORIZATION_ENDPOINT: https://id.${SECRET_DOMAIN}/authorize
              OIDC_OP_TOKEN_ENDPOINT: https://id.${SECRET_DOMAIN}/api/oidc/token
              OIDC_OP_USER_ENDPOINT: https://id.${SECRET_DOMAIN}/api/oidc/userinfo
              OIDC_OP_JWKS_ENDPOINT: https://id.${SECRET_DOMAIN}/.well-known/jwks.json
              OIDC_USE_PKCE: false
              OIDC_VERIFY_SSL: true
              OIDC_USERNAME_CLAIM: preferred_username
              LD_CSRF_TRUSTED_ORIGINS: "https://bookmarks.${SECRET_DOMAIN}"
            envFrom: *envFrom
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 9090
    route:
      app:
        hostnames:
          - "bookmarks.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: networking
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /etc/linkding/data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
