---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: automorph
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: automorph-secret
    template:
      data:
        # App
        GITHUB_TOKEN: "{{ .OPENCLAW_GH_TOKEN }}"
  dataFrom:
    - extract:
        key: github
