---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: automorph
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      automorph:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/holjab/automorph
              tag: latest@sha256:2ba470ef2d7da5af854a30671e2bc7e735c481fe910bfe3f046a773ce73d6a57
            env:
              TZ: Europe/Berlin
              HOME: /tmp
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 2000Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 8080
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN_INTERNAL}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          automorph:
            app:
              - path: /automorph/apps
                subPath: apps
              - path: /automorph/tools/morphe-data
                subPath: morphe-data
              - path: /automorph/tools/automorph-data
                subPath: automorph-data
      tmpfs:
        type: emptyDir
        advancedMounts:
          automorph:
            app:
              - path: /automorph/tmp
                subPath: automorph-tmp
              - path: /tmp
                subPath: tmp
