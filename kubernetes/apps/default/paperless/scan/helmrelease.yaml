---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-scan
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      paperless-scan:
        replicas: 0
        labels:
          nfsMount: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/philippmundhenk/brotherscannerdocker
              tag: v2.1.0@sha256:15aa1bbeafcc2abaabe0a96d783ce0993337dc8d0081149ae6f1d8a65c2803c4
            env:
              UID: 1000
              GID: 1000
              TZ: Europe/Berlin
              NAME: Scanner
              MODEL: MFC-L2710DN
              IPADDRESS: 192.168.1.31
              HOST_IPADDRESS: &ip 192.168.222.84
              WEBSERVER: true
              DISABLE_GUI_SCANTOEMAIL: true
              DISABLE_GUI_SCANTOIMAGE: true
              DISABLE_GUI_SCANTOOCR: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: 80
      brother:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: *ip
        ports:
          scan-udp:
            port: 54925
            protocol: UDP
          scan-tcp:
            port: 54921
            protocol: TCP
          snmp:
            port: 161
            protocol: UDP
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN_INTERNAL}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      nas:
        type: nfs
        server: nas01.${SECRET_DOMAIN_INT}
        path: /mnt/data/paperless/consume
        globalMounts:
          - path: /scans
