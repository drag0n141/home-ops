---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anchor
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: anchor-secret
    template:
      data:
        # App
        JWT_SECRET: "{{ .ANCHOR_JWT_SECRET }}"
        # Database
        PG_HOST: &dbhost "postgres-rw.database.svc.cluster.local"
        PG_PORT: "5432"
        PG_USER: &dbuser "{{ .ANCHOR_POSTGRES_USER }}"
        PG_PASSWORD: &dbpass "{{ .ANCHOR_POSTGRES_PASSWORD }}"
        PG_DATABASE: &dbname "{{ .ANCHOR_POSTGRES_DB }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_HOST: *dbhost
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: anchor
    - extract:
        key: cloudnative-pg
