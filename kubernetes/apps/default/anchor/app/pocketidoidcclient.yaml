---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: anchor
spec:
  name: Anchor
  callbackUrls:
    - "https://anchor.${SECRET_DOMAIN}/api/auth/oidc/callback"
    - "anchor://oidc/callback"
  allowedUserGroups:
    - name: id-home
      namespace: security
  secret:
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
