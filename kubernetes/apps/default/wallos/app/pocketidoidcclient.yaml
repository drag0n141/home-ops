---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: wallos
spec:
  name: Wallos
  callbackUrls:
    - "https://wallos.${SECRET_DOMAIN_INTERNAL}"
  allowedUserGroups:
    - name: id-admin
      namespace: security
  secret:
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
