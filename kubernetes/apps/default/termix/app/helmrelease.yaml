---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: termix
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      termix:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lukegus/termix
              tag: release-2.9.0@sha256:c0261e700d8feb649393be274e1c8b143ff9afd9dff63f73bd2449f036a7dff0
            env:
              TZ: Europe/Berlin
              PORT: &port 8080
              ENABLE_GUACAMOLE: true
              GUACD_HOST: termix-guacd.default.svc.cluster.local
              GUACD_PORT: "4822"
              OIDC_AUTHORIZATION_URL: "https://id.${SECRET_DOMAIN}/authorize"
              OIDC_TOKEN_URL: "https://id.${SECRET_DOMAIN}/api/oidc/token"
              OIDC_ISSUER_URL: "https://id.${SECRET_DOMAIN}"
              OIDC_USERINFO_URL: "https://id.${SECRET_DOMAIN}/api/oidc/userinfo"
              OIDC_NAME_PATH: display_name
              OIDC_FORCE_HTTPS: true
              OIDC_ENV_OVERRIDE: true
              OIDC_ADMIN_GROUP: ID-Admin
              OIDC_SCOPES: "openid profile email groups"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-credentials"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN_INTERNAL}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
    persistence:
      config:
        type: secret
        name: "{{ .Release.Name }}-secret"
        globalMounts:
          - path: /app/data/.opk/config.yml
            subPath: config.yml
            readOnly: true
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
