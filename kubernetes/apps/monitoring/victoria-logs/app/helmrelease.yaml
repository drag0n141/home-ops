---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app victoria-logs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
    server:
      fullnameOverride: *app
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 50Gi
      retentionPeriod: 14d
      route:
        enabled: true
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - logs.${SECRET_DOMAIN_INTERNAL}
        parentRefs:
          - name: envoy-internal
            namespace: networking
      serviceMonitor:
        enabled: true
