---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    type: victoriametrics-logs-datasource
    name: VictoriaLogs
    access: proxy
    url: http://victoria-logs-server.monitoring.svc.cluster.local:9428
  plugins:
    - name: victoriametrics-logs-datasource
      version: 0.26.3
