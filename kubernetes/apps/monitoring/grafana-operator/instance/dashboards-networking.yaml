---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: networking
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  title: Networking
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: traefik
spec:
  # HINWEIS: laut Notizen inzwischen Envoy Gateway statt Traefik im Einsatz - Dashboard evtl. nicht mehr relevant,
  # nur zur Vollstaendigkeit aus der alten Konfiguration uebernommen. Ggf. entfernen.
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  folderRef: networking
  instanceSelector:
    matchLabels:
      dashboards: grafana
  url: https://grafana.com/api/dashboards/4475/revisions/5/download
