---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  disableDefaultAdminSecret: true
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
            fsGroup: 472
            fsGroupChangePolicy: OnRootMismatch
          initContainers:
            - name: init-db
              image: ghcr.io/home-operations/postgres-init:18
              envFrom:
                - secretRef:
                    name: grafana-secret
                - secretRef:
                    name: grafana-oidc-credentials
          containers:
            - name: grafana
              envFrom:
                - secretRef:
                    name: grafana-secret
                - secretRef:
                    name: grafana-oidc-credentials
              env:
                - name: GF_ANALYTICS_CHECK_FOR_UPDATES
                  value: "false"
                - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
                  value: "false"
                - name: GF_ANALYTICS_REPORTING_ENABLED
                  value: "false"
                - name: GF_AUTH_ANONYMOUS_ENABLED
                  value: "false"
                - name: GF_AUTH_BASIC_ENABLED
                  value: "false"
                - name: GF_AUTH_GENERIC_OAUTH_ENABLED
                  value: "true"
                - name: GF_AUTH_GENERIC_OAUTH_API_URL
                  value: https://id.${SECRET_DOMAIN}/api/oidc/userinfo
                - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
                  value: https://id.${SECRET_DOMAIN}/authorize
                - name: GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES
                  value: "false"
                - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
                  value: "contains(groups[*], 'ID-Admin') && 'Admin' || 'Viewer'"
                - name: GF_AUTH_GENERIC_OAUTH_SCOPES
                  value: openid profile email groups
                - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
                  value: https://id.${SECRET_DOMAIN}/api/oidc/token
                - name: GF_AUTH_OAUTH_AUTO_LOGIN
                  value: "true"
                - name: GF_DATE_FORMATS_USE_BROWSER_LOCALE
                  value: "true"
                - name: GF_DATABASE_TYPE
                  value: postgres
                - name: GF_EXPLORE_ENABLED
                  value: "true"
                - name: GF_FEATURE_TOGGLES_ENABLE
                  value: publicDashboards
                - name: GF_LOG_MODE
                  value: console
                - name: GF_NEWS_NEWS_FEED_ENABLED
                  value: "false"
                - name: GF_PANELS_DISABLE_SANITIZE_HTML
                  value: "true"
                - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
                  value: natel-discrete-panel,pr0ps-trackmap-panel,panodata-map-panel
                - name: GF_SECURITY_ANGULAR_SUPPORT_ENABLED
                  value: "true"
                - name: GF_SECURITY_COOKIE_SAMESITE
                  value: grafana
                - name: GF_SERVER_ROOT_URL
                  value: https://grafana.${SECRET_DOMAIN_INTERNAL}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
  httpRoute:
    spec:
      hostnames:
        - grafana.${SECRET_DOMAIN_INTERNAL}
      parentRefs:
        - name: envoy-internal
          namespace: networking
