---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: smartctl-exporter
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  title: SMARTCTL Exporter
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: smartctl-exporter
spec:
  allowCrossNamespaceImport: true
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  folderRef: smartctl-exporter
  instanceSelector:
    matchLabels:
      dashboards: grafana
  url: https://grafana.com/api/dashboards/22604/revisions/2/download
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: smart
spec:
  allowCrossNamespaceImport: true
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  folderRef: smartctl-exporter
  instanceSelector:
    matchLabels:
      dashboards: grafana
  url: https://grafana.com/api/dashboards/20204/revisions/1/download
