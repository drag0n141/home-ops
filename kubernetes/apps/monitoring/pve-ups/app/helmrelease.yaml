---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pve-ups
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      pve-ups:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/ffind-dev/pve-ups
              tag: v4.4.0@sha256:a3f308b3a79b8bc6495f64a68edcdfac0ef7dbf22bd44cf5033774bdc48f2739
            env:
              TZ: Europe/Berlin
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN_INTERNAL}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
    persistence:
      agents:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          pve-ups:
            app:
              - path: /etc/pve-usv
                subPath: config
              - path: /var/lib/pve-usv
                subPath: data
      tmpfs:
        type: emptyDir
        advancedMounts:
          pve-ups:
            app:
              - path: /tmp
                subPath: tmp
