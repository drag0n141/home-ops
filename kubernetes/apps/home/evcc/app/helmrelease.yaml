---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: evcc
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      evcc:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/evcc/evcc
              tag: 0.316.0@sha256:07f73d4360486fde9d2c1d3d0e8ac44d5d87a636ad75dc2f489ccd28310c1594
            env:
              TZ: Europe/Berlin
              HOME: /data
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
          trial-token-updater:
            image:
              repository: public.ecr.aws/docker/library/python
              tag: 3.14-slim@sha256:7bf6c3111fe094f8ee1a1cbcdc63c4cfb345b0e3df42d5aa9a90b3b4b022ab6d
            command: ["python", "/scripts/trial-token-updater.py"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: 7070
      sync:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: "evcc-api.${SECRET_DOMAIN_INTERNAL}"
          lbipam.cilium.io/ips: 192.168.222.122
        ports:
          ocpp:
            port: 8887
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN_INTERNAL}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      script:
        type: configMap
        name: "{{ .Release.Name }}-scripts"
        advancedMounts:
          evcc:
            trial-token-updater:
              - path: /scripts/trial-token-updater.py
                subPath: trial-token-updater.py
                readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
