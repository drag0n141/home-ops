---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  labels:
    app.kubernetes.io/instance: evcc
    app.kubernetes.io/name: evcc
  name: evcc
spec:
  appProtocols:
    - gateway.envoyproxy.io/ws
    - gateway.envoyproxy.io/wss
  endpoints:
    - fqdn:
        hostname: evcc.${SECRET_DOMAIN_INT}
        port: 7070
