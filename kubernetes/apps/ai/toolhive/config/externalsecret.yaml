---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: toolhive-secret
    template:
      data:
        # App
        signing-key: |-
          {{ .TOOLHIVE_SIGNING_KEY }}
        hmac-key: "{{ .TOOLHIVE_HMAC_KEY }}"
        # Authserver storage (Dragonfly)
        DRAGONFLY_PASSWORD: "{{ .DRAGONFLY_PASSWORD }}"
  dataFrom:
    - extract:
        key: toolhive
    - extract:
        key: dragonfly
