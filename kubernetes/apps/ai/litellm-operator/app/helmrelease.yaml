---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: litellm-operator
  values:
    controller:
      leaderElection:
        enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
