---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubectl-mcp
spec:
  image: ghcr.io/rohitg00/kubectl-mcp-server:2.0.0
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  groupRef:
    name: mcp-tools
  env:
    - name: MCP_ALLOW_UNAUTHENTICATED
      value: "true"
    - name: MCP_ALLOWED_HOSTS
      value: "*"
    - name: MCP_ALLOWED_ORIGINS
      value: "*"
    - name: MCP_MASK_SECRETS
      value: "true"
    - name: MCP_SERVER_HOST
      value: 0.0.0.0
    - name: MCP_SERVER_PORT
      value: "8000"
    - name: MCP_SERVER_TRANSPORT
      value: http
    - name: MCP_TOOL_SEARCH
      value: "true"
  serviceAccount: kubectl-mcp-sa
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
