---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: plex-mcp
spec:
  image: ghcr.io/vladimir-tutin/plex-mcp-server:1.2.0
  transport: streamable-http
  mcpPort: 3001
  groupRef:
    name: mcp-tools
  env:
    - name: PLEX_URL
      valueFrom:
        secretKeyRef:
          name: plex-mcp-secret
          key: PLEX_URL
    - name: PLEX_TOKEN
      valueFrom:
        secretKeyRef:
          name: plex-mcp-secret
          key: PLEX_TOKEN
