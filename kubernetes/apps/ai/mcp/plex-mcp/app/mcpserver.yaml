---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: plex-mcp
spec:
  image: ghcr.io/vladimir-tutin/plex-mcp-server:1.5.0
  transport: streamable-http
  mcpPort: 3001
  groupRef:
    name: mcp-tools
  secrets:
    - name: plex-mcp-url-secret
      key: PLEX_URL
      targetEnvName: PLEX_URL
    - name: plex-mcp-secret
      key: PLEX_TOKEN
      targetEnvName: PLEX_TOKEN
