---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-kopiur-garage"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: "${APP}-kopiur-garage"
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .K8S_KOPIUR_AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .K8S_KOPIUR_AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: garage-nas
    - extract:
        key: kopiur-garage
