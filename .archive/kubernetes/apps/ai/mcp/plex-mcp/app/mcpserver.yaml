---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: plex-mcp
spec:
  image: ghcr.io/vladimir-tutin/plex-mcp-server:1.5.0
  transport: streamable-http
  mcpPort: 3001
  groupRef:
    name: mcp-tools
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          envFrom:
            - secretRef:
                name: plex-mcp-secret
